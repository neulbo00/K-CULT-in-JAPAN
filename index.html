<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본 한류 이벤트 인포그래픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5FA;--card:#fff;--ink:#1A1B2E;--mute:#5B5F77;--line:#E1E3F0;--bar:#BFC4E6;--acc:#E4256B;--chip:#ECEEF8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131F;--card:#1B1D2E;--ink:#ECEDF7;--mute:#9A9EB8;--line:#2B2E47;--bar:#3E4373;--acc:#FF5C95;--chip:#25283F;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans KR","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:26px;line-height:1.3;margin:0 0 6px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;margin:0 0 22px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 4px;font-weight:700}
.note{color:var(--mute);font-size:12px;margin:0 0 14px}
.months{display:flex;align-items:flex-end;gap:3px;height:170px;margin-top:18px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mute)}
.col b{font-weight:500;margin-bottom:2px}
.col i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
.col.cur i{background:var(--acc)}.col.cur b,.col.cur span{color:var(--acc);font-weight:700}
.col span{margin-top:4px;height:14px}
.yr{display:flex;font-size:11px;color:var(--mute);margin-top:2px}
.row{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.row .t{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--acc);border-radius:5px}
.row b{text-align:right;font-weight:500}
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.grid section{margin:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:99px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ev{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.d{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.d strong{display:block;color:var(--ink);font-size:13px}
.n{font-weight:500;overflow-wrap:anywhere}
.m{font-size:12px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;background:var(--chip);border-radius:4px;padding:0 6px;margin-right:6px}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p class="sub" id="sub"></p>

<section>
<h2>월별 이벤트 수</h2>
<p class="note">공연 시작일 기준. 긴 투어는 시작한 달에만 셉니다.</p>
<div class="months" id="months"></div>
<div class="yr" id="yr"></div>
</section>

<div class="grid">
<section><h2>이벤트 유형</h2><div id="types"></div></section>
<section><h2>한류 카테고리</h2><div id="cats"></div></section>
</div>

<section style="margin-top:14px">
<h2>프로모터 상위</h2>
<p class="note">표기가 다른 같은 회사는 합산했습니다.</p>
<div id="promo"></div>
</section>

<section>
<h2>다가오는 일정</h2>
<p class="note" id="upnote"></p>
<div class="chips" id="chips"></div>
<div id="list"></div>
</section>
</main>
<script src="data.js"></script>
<script>
(function(){
var D=window.KDATA,$=function(i){return document.getElementById(i)};
var cur=D.generatedAt.slice(0,7);
var peak=D.months.reduce(function(a,b){return b[1]>a[1]?b:a});
$('h').textContent=Number(peak[0].slice(5))+'월에 '+peak[1]+'건, 일본 한류 이벤트가 가장 몰립니다';
$('sub').textContent='총 '+D.total+'건 · 기준일 '+D.generatedAt+' · 출처: Notion 「일본 한류 이벤트」';
var mx=peak[1];
$('months').innerHTML=D.months.map(function(m){
 return '<div class="col'+(m[0]===cur?' cur':'')+'"><b>'+m[1]+'</b><i style="height:'+Math.max(m[1]/mx*130,2)+'px"></i><span>'+Number(m[0].slice(5))+'</span></div>';
}).join('');
var yrs={};D.months.forEach(function(m){var y=m[0].slice(0,4);yrs[y]=(yrs[y]||0)+1});
$('yr').innerHTML=Object.keys(yrs).map(function(y){return '<span style="flex:'+yrs[y]+';border-top:1px solid var(--line);padding-top:2px">'+y+'</span>'}).join('');
function bars(id,rows){var max=Math.max.apply(null,rows.map(function(r){return r[1]}));
 $(id).innerHTML=rows.map(function(r){return '<div class="row"><span>'+r[0]+'</span><span class="t"><i style="width:'+r[1]/max*100+'%"></i></span><b>'+r[1]+'</b></div>'}).join('')}
bars('types',D.types);bars('cats',D.cats);bars('promo',D.promoters);
function md(s){return Number(s.slice(5,7))+'/'+Number(s.slice(8))}
var sel='전체',tp=['전체'].concat(D.types.map(function(t){return t[0]}).filter(function(t){return D.upcoming.some(function(u){return u[1]===t})}));
$('upnote').textContent='기준일부터 시작하는 일정 '+D.upcoming.length+'건 (시작일순)';
function draw(){
 $('chips').innerHTML=tp.map(function(t){return '<button type="button" aria-pressed="'+(t===sel)+'" data-t="'+t+'">'+t+'</button>'}).join('');
 $('list').innerHTML=D.upcoming.filter(function(u){return sel==='전체'||u[1]===sel}).map(function(u){
  var d=md(u[2])+(u[3]?' – '+md(u[3]):'');
  return '<div class="ev"><div class="d"><strong>'+d+'</strong></div><div><div class="n">'+u[0].replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div><div class="m"><span class="tag">'+u[1]+'</span>'+u[4]+'회차</div></div></div>'}).join('')||'<p class="note">해당 유형의 일정이 없습니다.</p>';
}
$('chips').addEventListener('click',function(e){var t=e.target.getAttribute('data-t');if(t){sel=t;draw()}});
draw();
})();
</script>
</body>
</html>
